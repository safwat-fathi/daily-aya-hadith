<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Daily Aya & Hadith for Slack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 md:p-12">
        <div class="mb-6 flex justify-center">
            <!-- Decorative icon or logo placeholder -->
            <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 text-3xl shadow-sm">
                📖
            </div>
        </div>
        
        <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">Daily Aya & Hadith</h1>
        
        <p class="text-lg text-gray-600 mb-10 leading-relaxed">
            Enhance your workspace with daily spiritual reminders. Get a carefully selected Aya and Hadith delivered straight to your Slack channel every day.
        </p>

        <a href="/api/v1/slack/install" class="inline-flex items-center justify-center space-x-3 bg-white border border-gray-300 text-gray-700 font-semibold px-8 py-4 rounded-lg shadow-sm hover:bg-gray-50 transition-all duration-200 w-full sm:w-auto">
            <svg class="w-6 h-6" viewBox="0 0 122.8 122.8">
                <path d="M25.8 77.6c0 7.1-5.8 12.9-12.9 12.9S0 84.7 0 77.6s5.8-12.9 12.9-12.9h12.9v12.9zm6.5 0c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9v32.3c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V77.6z" fill="#e01e5a"></path>
                <path d="M45.2 25.8c-7.1 0-12.9-5.8-12.9-12.9S38.1 0 45.2 0s12.9 5.8 12.9 12.9v12.9H45.2zm0 6.5c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H12.9C5.8 58.1 0 52.3 0 45.2s5.8-12.9 12.9-12.9h32.3z" fill="#36c5f0"></path>
                <path d="M97 45.2c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9-5.8 12.9-12.9 12.9H97V45.2zm-6.5 0c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V12.9C64.7 5.8 70.5 0 77.6 0s12.9 5.8 12.9 12.9v32.3z" fill="#2eb67d"></path>
                <path d="M77.6 97c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9-12.9-5.8-12.9-12.9V97h12.9zm0-6.5c-7.1 0-12.9-5.8-12.9-12.9s5.8-12.9 12.9-12.9h32.3c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H77.6z" fill="#ecb22e"></path>
            </svg>
            <span class="text-lg">Add to Slack</span>
        </a>

        <div class="mt-8 pt-6 border-t border-gray-100 flex justify-center space-x-6 text-sm text-gray-500">
            <a href="/static/privacy.html" class="hover:text-emerald-600 transition-colors">Privacy Policy</a>
            <a href="/static/support.html" class="hover:text-emerald-600 transition-colors">Support</a>
        </div>
    </div>

</html>
